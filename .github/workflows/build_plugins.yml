name: Build Plugins

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.12'

      - name: Build Plugins
        run: |
          gradle make makePluginsJson

      - name: Stage build output
        run: |
          rm -rf build/staging
          mkdir -p build/staging
          cp build/plugins.json build/staging/plugins.json
          sed -i "s|https://raw.githubusercontent.com/$GITHUB_REPOSITORY/gh-pages/|https://cdn.jsdelivr.net/gh/$GITHUB_REPOSITORY@gh-pages/|g" build/staging/plugins.json
          cp ReAnime/build/ReAnime.cs3 build/staging/ReAnime.cs3
          cat > build/staging/repo.json <<EOF
          {
            "name": "dkrepo",
            "description": "Cloudstream extension Repository by dkrepo",
            "manifestVersion": 1,
            "pluginLists": [
              "https://cdn.jsdelivr.net/gh/$GITHUB_REPOSITORY@gh-pages/plugins.json"
            ]
          }
          EOF

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/staging
          branch: gh-pages